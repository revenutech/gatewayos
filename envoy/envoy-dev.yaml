# =============================================================================
# Envoy gRPC-REST Transcoder — Development Configuration
# Listens on 0.0.0.0:8085 (Docker Compose network)
# In K8s (sidecar), use the ConfigMap version which listens on 127.0.0.1:8085
# =============================================================================

static_resources:
  listeners:
    - name: grpc_transcoder
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8085
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: grpc_transcoder
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: ledgeros_grpc
                      domains: ["*"]
                      routes:
                        # --- Postings (Transactions) ---
                        - match:
                            prefix: /grpc/v1/postings
                            headers:
                              - name: ":method"
                                string_match:
                                  exact: POST
                          route:
                            cluster: ledgeros_grpc
                            timeout: 5s
                        - match:
                            prefix: /grpc/v1/postings/
                          route:
                            cluster: ledgeros_grpc
                            timeout: 3s

                        # --- Balances ---
                        - match:
                            prefix: /grpc/v1/balances
                          route:
                            cluster: ledgeros_grpc
                            timeout: 3s

                        # --- Settlements ---
                        - match:
                            prefix: /grpc/v1/settlements
                          route:
                            cluster: ledgeros_grpc
                            timeout: 10s

                        # --- Reconciliation ---
                        - match:
                            prefix: /grpc/v1/reconciliation
                          route:
                            cluster: ledgeros_grpc
                            timeout: 5s

                http_filters:
                  - name: envoy.filters.http.grpc_json_transcoder
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                      proto_descriptor: /etc/envoy/proto/ledgeros.pb
                      services:
                        - revenu.ledgeros.v1.PostingService
                        - revenu.ledgeros.v1.BalanceService
                        - revenu.ledgeros.v1.SettlementService
                        - revenu.ledgeros.v1.ReconciliationService
                      print_options:
                        add_whitespace: false
                        always_print_primitive_fields: true
                        always_print_enums_as_ints: false
                        preserve_proto_field_names: true
                      convert_grpc_status: true
                      ignore_unknown_query_parameters: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: ledgeros_grpc
      connect_timeout: 2s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: ledgeros_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ledgeros
                      port_value: 9081
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 50
            max_pending_requests: 50
            max_requests: 50
            max_retries: 3

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
  access_log:
    - name: envoy.access_loggers.stdout
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
