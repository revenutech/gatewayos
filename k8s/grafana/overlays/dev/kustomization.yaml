apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: ServiceAccount
      name: grafana
    patch: |
      - op: add
        path: /metadata/annotations/iam.gke.io~1gcp-service-account
        value: grafana-dev@revenu-gateway-dev.iam.gserviceaccount.com
  - target:
      kind: Deployment
      name: grafana
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "https://dashboard.allenty.io/"
  - target:
      kind: Ingress
      name: grafana
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: dashboard.allenty.io
      - op: add
        path: /metadata/annotations/kubernetes.io~1ingress.class
        value: gce
      - op: add
        path: /metadata/annotations/networking.gke.io~1managed-certificates
        value: grafana-cert
      - op: add
        path: /metadata/annotations/networking.gke.io~1v1beta1.FrontendConfig
        value: grafana-frontend
