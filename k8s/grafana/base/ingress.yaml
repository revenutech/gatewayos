# =============================================================================
# Grafana Ingress — accessible at gateway.allenty.io/dashboard/
# Routes /dashboard/* directly to Grafana, bypassing KrakenD.
# ISO 27001: A.8.16 (Monitoring activities)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: revenu-platform
  annotations: {}
  # Annotations set via kustomize overlay per environment
spec:
  rules:
    - host: gateway.allenty.io
      http:
        paths:
          - path: /dashboard
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
