# =============================================================================
# Revenu Platform — Network Policy: KrakenD Egress
# ISO 27001: A.13.1.1 (Network controls)
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-krakend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: krakend
  policyTypes:
    - Egress
  egress:
    # DNS resolution (kube-dns)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # LedgerOS (:8081 HTTP + :9081 gRPC)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ledgeros
      ports:
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 9081

    # Paymentos (:8082)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: paymentos
      ports:
        - protocol: TCP
          port: 8082

    # AtmOS (:8088)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: atmos
      ports:
        - protocol: TCP
          port: 8088

    # Identos (:8091)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: identos
      ports:
        - protocol: TCP
          port: 8091

    # OnboardOS (:8092)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: onboardos
      ports:
        - protocol: TCP
          port: 8092

    # AccountOS (:8093)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: accountos
      ports:
        - protocol: TCP
          port: 8093

    # FinanceOS (:8095)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: financeos
      ports:
        - protocol: TCP
          port: 8095

    # Keycloak JWKS (JWT validation)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak
          podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 8080

    # Redis (rate limiting)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379

    # OTel Collector (telemetry)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - protocol: TCP
          port: 4317
