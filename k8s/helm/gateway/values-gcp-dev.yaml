# =============================================================================
# Gateway — GCP Dev Environment
# GKE zonal (sae1-a), 1 replica, LoadBalancer, debug
# Estimated cost: ~$15/month
# =============================================================================

replicaCount: 1

image:
  repository: southamerica-east1-docker.pkg.dev/revenu-gateway-dev/gateway-dev/gateway
  tag: "dev-latest"
  pullPolicy: Always

serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: gateway-app-dev@revenu-gateway-dev.iam.gserviceaccount.com

service:
  type: NodePort

ingress:
  enabled: true
  className: gce
  annotations:
    kubernetes.io/ingress.global-static-ip-name: gateway-dev-global-ip
    networking.gke.io/managed-certificates: gateway-dev-cert
    networking.gke.io/v1beta1.FrontendConfig: gateway-frontend-config
  hosts:
    - host: gateway.allenty.io
      paths:
        - path: /
          pathType: Prefix

managedCertificate:
  enabled: true
  domains:
    - gateway.allenty.io

networkPolicy:
  enabled: false

autoscaling:
  enabled: false

probes:
  type: tcpSocket  # GKE kubelet HTTP prober workaround

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

envoy:
  enabled: false  # Disable gRPC transcoder for dev (no proto descriptor)
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Use config from Docker image (no ConfigMap override)
configMap:
  enabled: false

cronjob:
  dataRetention:
    redis:
      host: redis
      port: "6379"

serviceMonitor:
  enabled: false

prometheusRule:
  enabled: false

cronjob:
  dataRetention:
    enabled: false

envoy:
  enabled: false

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

krakend:
  env: dev

# Disable Prometheus Operator resources (CRDs not installed)
serviceMonitor:
  enabled: false

prometheusRule:
  enabled: false

# Disable network policies for dev
networkPolicy:
  enabled: false

# Disable PDB for single replica
pdb:
  enabled: false
