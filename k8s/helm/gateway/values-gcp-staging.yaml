# =============================================================================
# Gateway — GCP Staging Environment (UAT)
# GKE zonal (sae1-a), 2 replicas, GCE Ingress, ManagedCert
# Domain: sandbox.api.revenu.tech
# =============================================================================

replicaCount: 2

image:
  repository: southamerica-east1-docker.pkg.dev/revenu-gateway-dev/gateway-dev/gateway
  tag: "staging-latest"
  pullPolicy: Always

serviceAccount:
  create: true
  annotations: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: gce
  annotations:
    networking.gke.io/managed-certificates: gateway-cert
  hosts:
    - host: sandbox.api.revenu.tech
      paths:
        - path: /
          pathType: Prefix

backendConfig:
  enabled: true

managedCertificate:
  enabled: true
  domains:
    - sandbox.api.revenu.tech

autoscaling:
  enabled: false

probes:
  type: tcpSocket

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

krakend:
  env: staging

# Disable gRPC transcoder (no proto descriptor)
envoy:
  enabled: false

# Use config from Docker image (no ConfigMap override)
configMap:
  enabled: false

serviceMonitor:
  enabled: false

prometheusRule:
  enabled: false

networkPolicy:
  enabled: false

pdb:
  enabled: false

# Tolerate onboardos node taint
tolerations:
  - key: "workload"
    operator: "Equal"
    value: "onboardos"
    effect: "NoSchedule"
