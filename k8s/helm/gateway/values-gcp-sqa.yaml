# =============================================================================
# Gateway — GCP SQA Environment (BASA Connectivity)
# GKE zonal (sae1-a), Shared VPC, IP Masquerade for BASA
# =============================================================================

replicaCount: 1

image:
  repository: southamerica-east1-docker.pkg.dev/revenu-gateway-sqa/gateway/gateway
  tag: "sqa-latest"
  pullPolicy: Always

serviceAccount:
  create: true
  name: gateway
  annotations: {}

service:
  type: NodePort
  httpPort: 8080
  metricsPort: 8090

ingress:
  enabled: false

autoscaling:
  enabled: false

probes:
  type: tcpSocket

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

envoy:
  enabled: false

configMap:
  enabled: false

configHash: "v15"

cronjob:
  dataRetention:
    enabled: false

krakend:
  env: sqa
  fcEnable: "1"
  fcSettings: /etc/krakend/settings/sqa
  fcPartials: /etc/krakend/partials
  fcTemplates: /etc/krakend/templates
  port: "8080"
  usageDisable: "1"
  configFile: /etc/krakend/krakend.tmpl

serviceMonitor:
  enabled: false

prometheusRule:
  enabled: false

networkPolicy:
  enabled: false

pdb:
  enabled: false

# Keycloak Service Bridge - connects to Keycloak ILB in ledgeros-sqa cluster
keycloakBridge:
  enabled: true
  ip: "10.120.0.7"
  port: 8080
