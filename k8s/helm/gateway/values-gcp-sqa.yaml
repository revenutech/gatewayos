# =============================================================================
# Gateway — GCP SQA Environment (BASA Connectivity)
# GKE zonal (sae1-a), Shared VPC, IP Masquerade for BASA
# =============================================================================

replicaCount: 1

image:
  repository: southamerica-east1-docker.pkg.dev/revenu-gateway-sqa/gateway/gateway
  tag: "sqa-latest"
  pullPolicy: Always

serviceAccount:
  create: true
  name: gateway
  annotations: {}

service:
  type: NodePort
  httpPort: 8080
  metricsPort: 8090

ingress:
  enabled: false

autoscaling:
  enabled: false

probes:
  type: tcpSocket

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

envoy:
  enabled: false

configMap:
  enabled: false

configHash: "v15"

cronjob:
  dataRetention:
    enabled: false

krakend:
  env: sqa
  fcEnable: "1"
  fcSettings: /etc/krakend/settings/sqa
  fcPartials: /etc/krakend/partials
  fcTemplates: /etc/krakend/templates
  port: "8080"
  usageDisable: "1"
  configFile: /etc/krakend/krakend.tmpl

serviceMonitor:
  enabled: false

prometheusRule:
  enabled: false

networkPolicy:
  enabled: false

pdb:
  enabled: false

# Service Bridges - connect to ILBs in other clusters within Shared VPC
# Note: Keycloak uses MCS (Multi-Cluster Services) instead of bridge
# DNS: keycloak.keycloak.svc.clusterset.local:8080

keycloakBridge:
  enabled: false
  # ip: "10.120.0.7"  # Disabled - using MCS
  # port: 8080

ledgerosBridge:
  enabled: true
  ip: "10.120.0.6"
  httpPort: 8081
  grpcPort: 9081

paymentosBridge:
  enabled: false
  # Using MCS DNS: paymentos.paymentos.svc.clusterset.local
