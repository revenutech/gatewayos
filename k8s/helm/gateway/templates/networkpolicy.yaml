{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ledgeros
      ports:
        - { protocol: TCP, port: 8081 }
        - { protocol: TCP, port: 9081 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: paymentos
      ports:
        - { protocol: TCP, port: 8082 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: atmos
      ports:
        - { protocol: TCP, port: 8088 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: identos
      ports:
        - { protocol: TCP, port: 8091 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: onboardos
      ports:
        - { protocol: TCP, port: 8092 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: accountos
      ports:
        - { protocol: TCP, port: 8093 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: financeos
      ports:
        - { protocol: TCP, port: 8095 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - { protocol: TCP, port: 6379 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak
      ports:
        - { protocol: TCP, port: 8443 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: 4317 }
{{- end }}
