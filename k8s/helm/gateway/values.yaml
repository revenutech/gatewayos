# =============================================================================
# Gateway Helm Chart — Base Values
# Override per environment with values-gcp-{env}.yaml
# =============================================================================

replicaCount: 2

image:
  repository: devopsfaith/krakend
  tag: "2.7"
  pullPolicy: IfNotPresent

envoy:
  enabled: true
  image:
    repository: envoyproxy/envoy
    tag: "v1.31-latest"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

serviceAccount:
  create: true
  name: gateway
  annotations: {}

service:
  type: ClusterIP
  httpPort: 8080
  metricsPort: 8090

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

backendConfig:
  enabled: false
  healthCheck:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
    requestPath: /__health
  connectionDraining:
    drainingTimeoutSec: 30

managedCertificate:
  enabled: false
  domains: []

resources:
  requests:
    cpu: 250m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 75

pdb:
  enabled: true
  maxUnavailable: 1

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

probes:
  type: httpGet  # httpGet or tcpSocket
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: true
  interval: 15s

prometheusRule:
  enabled: true

cronjob:
  dataRetention:
    enabled: true
    schedule: "0 2 * * *"
    redis:
      host: redis
      port: "6379"

mtls:
  enabled: false

configHash: "PLACEHOLDER"

krakend:
  env: dev
  url: "http://localhost:8080"
  fcEnable: "1"
  fcSettings: /etc/krakend/settings
  fcPartials: /etc/krakend/partials
  fcTemplates: /etc/krakend/templates
  port: "8080"
  usageDisable: "1"

labels:
  app.kubernetes.io/name: gateway
  app.kubernetes.io/component: api-gateway
  app.kubernetes.io/part-of: revenu-platform
