# =============================================================================
# OTel Collector Kustomization
# Deploy: kubectl apply -k k8s/otel-collector/base/
# Or use overlays per environment for project-specific config
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: otel-collector-config
    files:
      - config.yaml
    options:
      disableNameSuffixHash: true
