# =============================================================================
# OTel Collector ServiceAccount — Workload Identity for GCP
# ISO 27001: A.8.2 (Privileged access rights)
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: monitoring
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: revenu-platform
  annotations:
    # Bound to GCP SA via Workload Identity (set per environment)
    # iam.gke.io/gcp-service-account: otel-collector-{env}@{project}.iam.gserviceaccount.com
