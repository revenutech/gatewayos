# =============================================================================
# Revenu Platform — KrakenD API Gateway Deployment
# ISO 27001: A.9.4.1 (Access restriction), A.13.1.1 (Network controls),
#            A.14.1.2 (Secure app services)
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: krakend
  labels:
    app.kubernetes.io/name: krakend
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: revenu-platform
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: krakend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: krakend
        app.kubernetes.io/component: api-gateway
        app.kubernetes.io/part-of: revenu-platform
      annotations:
        # Enterprise KrakenD equivalent: server/hot-reload
        # CI/CD updates this hash when config changes, triggering rolling restart
        checksum/config: "PLACEHOLDER_CONFIG_HASH"
    spec:
      serviceAccountName: krakend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: krakend
          image: devopsfaith/krakend:2.13.3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 8090
              protocol: TCP
          command: ["krakend", "run", "-c", "/etc/krakend/krakend.tmpl"]
          env:
            - name: FC_ENABLE
              value: "1"
            - name: FC_SETTINGS
              value: /etc/krakend/settings
            - name: FC_PARTIALS
              value: /etc/krakend/partials
            - name: FC_TEMPLATES
              value: /etc/krakend/templates
            - name: KRAKEND_PORT
              value: "8080"
            - name: USAGE_DISABLE
              value: "1"
          livenessProbe:
            httpGet:
              path: /__health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /__health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/krakend
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: mtls-certs
              mountPath: /etc/krakend/tls
              readOnly: true
        # ---------------------------------------------------------------------
        # Envoy sidecar: gRPC-REST transcoder (Enterprise KrakenD equivalent: backend/grpc)
        # Listens on 127.0.0.1:8085, transcodes REST to gRPC for LedgerOS :9081
        # ---------------------------------------------------------------------
        - name: envoy-grpc-transcoder
          image: envoyproxy/envoy:v1.31-latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - -c
            - /etc/envoy/envoy.yaml
            - --service-cluster
            - krakend-grpc-transcoder
            - --log-level
            - warn
          ports:
            - name: grpc-transcode
              containerPort: 8085
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /ready
              port: 9901
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 9901
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
            - name: envoy-proto
              mountPath: /etc/envoy/proto
              readOnly: true
            - name: envoy-tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: krakend-config
        - name: tmp
          emptyDir:
            sizeLimit: 50Mi
        - name: envoy-config
          configMap:
            name: envoy-grpc-transcoder
        - name: envoy-proto
          configMap:
            name: ledgeros-proto-descriptor
        - name: envoy-tmp
          emptyDir:
            sizeLimit: 10Mi
        - name: reloader-scripts
          configMap:
            name: krakend-config-reloader
            defaultMode: 0755
        # mTLS client certificates for backend communication
        - name: mtls-certs
          secret:
            secretName: krakend-mtls-client-cert
            items:
              - key: tls.crt
                path: client.crt
              - key: tls.key
                path: client.key
              - key: ca.crt
                path: ca.crt
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - krakend
                topologyKey: kubernetes.io/hostname
