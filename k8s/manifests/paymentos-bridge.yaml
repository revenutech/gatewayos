# =============================================================================
# Paymentos Bridge — Service pointing to paymentos-uat ILB
# Enables gateway-uat to access paymentos via paymentos:8082
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: paymentos
  namespace: default
  labels:
    app.kubernetes.io/name: paymentos-bridge
    app.kubernetes.io/component: bridge
    app.kubernetes.io/part-of: revenu-platform
  annotations:
    description: "Bridge service to paymentos-uat cluster via ILB"
spec:
  ports:
  - name: http
    port: 8082
    targetPort: 8082
    protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: paymentos
  namespace: default
  labels:
    app.kubernetes.io/name: paymentos-bridge
    app.kubernetes.io/component: bridge
    app.kubernetes.io/part-of: revenu-platform
subsets:
- addresses:
  - ip: 10.120.0.156
  ports:
  - name: http
    port: 8082
    protocol: TCP
