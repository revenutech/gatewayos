# =============================================================================
# Revenu Platform — WebSocket Proxy Ingress
# Enterprise KrakenD equivalent: websocket (multiplexer + direct modes)
# ISO 27001: A.13.1.1 (Network controls)
#
# KrakenD CE does not support WebSocket proxying.
# WebSocket connections bypass KrakenD and go directly to backend services
# via a dedicated Nginx Ingress path.
#
# Auth is handled at the WS handshake via query param token validation
# in the backend service (since WS doesn't support custom headers after upgrade).
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: krakend-websocket-ingress
  labels:
    app.kubernetes.io/name: krakend
    app.kubernetes.io/component: websocket-proxy
    app.kubernetes.io/part-of: revenu-platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Rate limit WS connections per IP (prevent WS flood)
      limit_req zone=api_gateway burst=10 nodelay;
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.revenu.com.br
      secretName: krakend-tls
  rules:
    - host: api.revenu.com.br
      http:
        paths:
          # LedgerOS real-time events (transactions, balances)
          - path: /ws/v1/ledger
            pathType: Prefix
            backend:
              service:
                name: ledgeros
                port:
                  number: 8081
          # Paymentos real-time payment status updates
          - path: /ws/v1/payments
            pathType: Prefix
            backend:
              service:
                name: paymentos
                port:
                  number: 8082
          # AtmOS real-time automation events
          - path: /ws/v1/automation
            pathType: Prefix
            backend:
              service:
                name: atmos
                port:
                  number: 8088
