# =============================================================================
# Revenu Platform — KrakenD ClusterIP Service
# ISO 27001: A.13.1.1 (Network controls)
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: krakend
  labels:
    app.kubernetes.io/name: krakend
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: revenu-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: krakend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 8090
      targetPort: 8090
      protocol: TCP
