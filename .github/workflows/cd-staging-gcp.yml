name: CD — Staging (GCP)

on:
  push:
    branches: [staging]

jobs:
  ci:
    name: CI Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate KrakenD config
        run: |
          bash tools/compile-config.sh krakend sandbox /tmp/krakend-compiled.json
          python3 -c "import json; json.load(open('/tmp/krakend-compiled.json')); print('Config compiles to valid JSON')"
      - name: Config audit
        run: bash tools/config-audit/audit.sh --strict

  build-deploy:
    name: Build, Sign & Deploy to GKE Staging
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    env:
      # Configurable via GitHub Environment Variables (Settings > Environments > staging)
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      GKE_CLUSTER: ${{ vars.GKE_CLUSTER }}
      GKE_LOCATION: ${{ vars.GKE_LOCATION }}
      AR_REPO: ${{ vars.AR_REPO }}
      IMAGE_NAME: gateway
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build --build-arg KRAKEND_ENV=sandbox -t ${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }} .
          docker tag ${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }} \
                     ${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:staging-latest

      # Sign image with Cosign (keyless OIDC)
      - uses: sigstore/cosign-installer@v3
      - name: Sign container image
        run: |
          cosign sign --yes ${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}

      - name: Push to Artifact Registry
        run: |
          docker push ${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
          docker push ${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:staging-latest

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}

      - name: Deploy with Helm (atomic — auto-rollback on failure)
        run: |
          helm upgrade --install gateway k8s/helm/gateway \
            -f k8s/helm/gateway/values-gcp-staging.yaml \
            --set image.tag=staging-${{ github.sha }} \
            --set configHash=${{ github.sha }} \
            --atomic --wait --timeout 5m

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            STATUS=$(kubectl get pods -l app.kubernetes.io/name=gateway -o jsonpath='{.items[0].status.phase}' 2>/dev/null || echo "Pending")
            echo "Attempt $i: Pod status = $STATUS"
            [ "$STATUS" = "Running" ] && exit 0
            sleep 10
          done
          echo "Health check failed"
          kubectl describe pods -l app.kubernetes.io/name=gateway
          exit 1

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {"text":"Gateway Staging Deploy: ${{ job.status }} — ${{ github.sha }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
