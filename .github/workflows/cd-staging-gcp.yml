name: CD — Staging (GCP)

on:
  push:
    branches: [staging]

env:
  GKE_CLUSTER: gateway-staging-cluster
  GKE_REGION: southamerica-east1
  AR_REPO: southamerica-east1-docker.pkg.dev/revenu-gateway-staging/gateway-staging
  IMAGE_NAME: gateway

jobs:
  ci:
    name: CI Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate KrakenD config
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/krakend:/etc/krakend \
            -e FC_ENABLE=1 -e FC_SETTINGS=/etc/krakend/settings \
            -e FC_PARTIALS=/etc/krakend/partials -e FC_TEMPLATES=/etc/krakend/templates \
            devopsfaith/krakend:2.7 check -c /etc/krakend/krakend.tmpl
      - name: Config audit
        run: bash tools/config-audit/audit.sh --strict

  build-deploy:
    name: Build, Sign & Deploy to GKE Staging
    needs: ci
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_STAGING }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_STAGING }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build -t ${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }} .
          docker tag ${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }} \
                     ${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:staging-latest

      # Sign image with Cosign (keyless OIDC)
      - uses: sigstore/cosign-installer@v3
      - name: Sign container image
        run: |
          cosign sign --yes ${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}

      - name: Push to Artifact Registry
        run: |
          docker push ${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
          docker push ${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:staging-latest

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_REGION }}

      - name: Deploy with Helm (atomic — auto-rollback on failure)
        run: |
          helm upgrade --install gateway k8s/helm/gateway \
            -f k8s/helm/gateway/values-gcp-staging.yaml \
            --set image.tag=staging-${{ github.sha }} \
            --set configHash=${{ github.sha }} \
            --set krakend.url=${{ vars.KRAKEND_URL }} \
            --atomic --wait --timeout 5m

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            STATUS=$(kubectl get pods -l app.kubernetes.io/name=gateway -o jsonpath='{.items[0].status.phase}' 2>/dev/null || echo "Pending")
            echo "Attempt $i: Pod status = $STATUS"
            [ "$STATUS" = "Running" ] && exit 0
            sleep 10
          done
          echo "Health check failed"
          kubectl describe pods -l app.kubernetes.io/name=gateway
          exit 1

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {"text":"Gateway Staging Deploy: ${{ job.status }} — ${{ github.sha }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
