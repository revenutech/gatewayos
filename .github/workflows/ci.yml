name: CI — Gateway

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate KrakenD Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check KrakenD config
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/krakend:/etc/krakend \
            -e FC_ENABLE=1 \
            -e FC_SETTINGS=/etc/krakend/settings \
            -e FC_PARTIALS=/etc/krakend/partials \
            -e FC_TEMPLATES=/etc/krakend/templates \
            devopsfaith/krakend:2.7 \
            check -c /etc/krakend/krakend.tmpl

      - name: Lint JSON configs
        run: |
          for f in $(find krakend/settings -name '*.json'); do
            echo "Validating $f..."
            python3 -m json.tool "$f" > /dev/null
          done

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t revenu-gateway:ci .

  # Enterprise KrakenD equivalent: server/hot-reload
  # Computes config hash and updates deployment annotation for rolling restart
  config-hash:
    name: Compute Config Hash
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Compute KrakenD config hash
        id: hash
        run: |
          HASH=$(find krakend/ -type f \( -name '*.json' -o -name '*.tmpl' \) \
            -exec sha256sum {} \; | sort | sha256sum | awk '{print $1}')
          echo "config_hash=${HASH}" >> $GITHUB_OUTPUT
          echo "Config hash: ${HASH}"
      - name: Update deployment manifest with config hash
        run: |
          sed -i "s/checksum\/config: .*/checksum\/config: \"${{ steps.hash.outputs.config_hash }}\"/" \
            k8s/manifests/deployment.yaml
          echo "Updated deployment.yaml with config hash: ${{ steps.hash.outputs.config_hash }}"
