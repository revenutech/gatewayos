name: CI — Gateway

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate KrakenD Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check KrakenD config
        run: |
          pip install -q jinja2 2>/dev/null || true
          bash tools/compile-config.sh krakend develop /tmp/krakend-compiled.json
          bash tools/compile-config.sh krakend production /tmp/krakend-prod.json
          echo "Compiled config is valid JSON"
          python3 -c "import json; json.load(open('/tmp/krakend-compiled.json')); print('JSON OK')"

      - name: Lint JSON configs
        run: |
          for f in $(find krakend/settings -name '*.json'); do
            echo "Validating $f..."
            python3 -m json.tool "$f" > /dev/null
          done

  # Enterprise KrakenD equivalent: developer/audit
  config-audit:
    name: Config Audit
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Run config audit
        run: bash tools/config-audit/audit.sh --strict

  # Enterprise KrakenD equivalent: developer/openapi
  openapi-generate:
    name: Generate OpenAPI Spec
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install -r tools/openapi-generator/requirements.txt
      - name: Generate OpenAPI spec
        run: |
          python tools/openapi-generator/generate.py \
            --endpoints-dir krakend/templates \
            --output openapi.yaml
      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: openapi.yaml

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t revenu-gateway:ci .

  # ISO 27001 A.5.21 — ICT supply chain security
  # ISO 27001 A.8.8 — Management of technical vulnerabilities
  container-security:
    name: Container Security Scan (A.5.21, A.8.8)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scanning
        run: docker build -t revenu-gateway:scan .
      - name: "A.5.21: Trivy vulnerability scan"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: revenu-gateway:scan
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
      - name: "A.5.21: Generate SBOM"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: revenu-gateway:scan
          format: cyclonedx
          output: sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  # Enterprise KrakenD equivalent: server/hot-reload
  # Computes config hash and updates deployment annotation for rolling restart
  config-hash:
    name: Compute Config Hash
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Compute KrakenD config hash
        id: hash
        run: |
          HASH=$(find krakend/ -type f \( -name '*.json' -o -name '*.tmpl' \) \
            -exec sha256sum {} \; | sort | sha256sum | awk '{print $1}')
          echo "config_hash=${HASH}" >> $GITHUB_OUTPUT
          echo "Config hash: ${HASH}"
      - name: Update deployment manifest with config hash
        run: |
          sed -i "s/checksum\/config: .*/checksum\/config: \"${{ steps.hash.outputs.config_hash }}\"/" \
            k8s/manifests/deployment.yaml
          echo "Updated deployment.yaml with config hash: ${{ steps.hash.outputs.config_hash }}"
