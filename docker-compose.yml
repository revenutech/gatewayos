services:
  krakend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: revenu-gateway
    ports:
      - "8080:8080"
      - "8090:8090"
    volumes:
      - ./krakend:/etc/krakend
    environment:
      - FC_ENABLE=1
      - FC_SETTINGS=/etc/krakend/settings
      - FC_PARTIALS=/etc/krakend/partials
      - FC_TEMPLATES=/etc/krakend/templates
      - FC_OUT=/etc/krakend/compiled-krakend.json
      - KRAKEND_PORT=8080
      - USAGE_DISABLE=1
    command: ["run", "-c", "/etc/krakend/krakend.tmpl"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/__health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    depends_on:
      envoy-grpc-transcoder:
        condition: service_healthy

  # Envoy sidecar: gRPC-REST transcoder (Enterprise KrakenD equivalent: backend/grpc)
  # In K8s this runs as a sidecar (127.0.0.1:8085), in Docker Compose it's a separate service
  envoy-grpc-transcoder:
    image: envoyproxy/envoy:v1.31-latest
    container_name: revenu-grpc-transcoder
    volumes:
      - ./envoy/envoy-dev.yaml:/etc/envoy/envoy.yaml:ro
      - ./envoy/proto:/etc/envoy/proto:ro
    ports:
      - "8085:8085"
      - "9901:9901"
    healthcheck:
      # A imagem do Envoy nao traz wget nem curl; bash com /dev/tcp e o que ha.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9901'"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
